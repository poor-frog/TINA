# Merge WITH deploy/compose/docker-compose.yml. Always run `up --no-build`.
# The original source-defined build: keys are inherited, but ignored with --no-build.
services:
  agent-reach:
    image: ghcr.io/poor-frog/tina-agent-reach:demo
  admin-api:
    image: ghcr.io/poor-frog/tina-admin-api:demo
    environment:
      TINA_VIEGEM_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN:?Set private Speech token in core-env}
      TINA_VIEGEM_URL: ${TRANSCRIPTION_SERVICE_URL:?Set private Speech IP in core-env}
  runtime:
    image: ghcr.io/poor-frog/tina-runtime:demo
  agent-worker:
    image: ghcr.io/poor-frog/tina-agent-worker:demo
  agent-api:
    image: ghcr.io/poor-frog/tina-agent-api:demo
  meeting-api:
    image: ghcr.io/poor-frog/tina-meeting-api:demo
  storage-init:
    image: ghcr.io/poor-frog/tina-meeting-api:demo
  gateway:
    image: ghcr.io/poor-frog/tina-gateway:demo
  flows-api:
    image: ghcr.io/poor-frog/tina-flows:demo
  flows-worker:
    image: ghcr.io/poor-frog/tina-flows:demo
  flows-mailbox:
    image: ghcr.io/poor-frog/tina-flows:demo
  mcp:
    image: ghcr.io/poor-frog/tina-mcp:demo
  terminal:
    image: ghcr.io/poor-frog/tina-terminal:demo
  dashboard:
    image: ghcr.io/poor-frog/tina-dashboard:demo

AWSTemplateFormatVersion: '2010-09-09'
Description: Internet egress for private TINA application tasks.

Parameters:
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  AppRouteTableA:
    Type: String
  AppRouteTableB:
    Type: String

Resources:
  NatAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnetId
      AllocationId: !GetAtt NatAddress.AllocationId
  AppEgressA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat
  AppEgressB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat

Outputs:
  NatGatewayId:
    Value: !Ref Nat

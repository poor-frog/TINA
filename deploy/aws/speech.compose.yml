name: tina-speech
services:
  viegem-models:
    image: ghcr.io/poor-frog/tina-viegem:prod
    entrypoint:
      - python
      - /app/viegem/install-models.py
      - --directory
      - /app/models/viegem-fsmn
    volumes:
      - viegem-models:/app/models/viegem-fsmn
    restart: 'no'
  viegem:
    image: ghcr.io/poor-frog/tina-viegem:prod
    environment:
      TINA_VIEGEM_HOST: '0.0.0.0'
      TINA_VIEGEM_DEVICE: cpu
      TINA_VIEGEM_PORT: '8000'
      TINA_VIEGEM_MODEL_DIR: /app/models/viegem-fsmn
      TINA_VIEGEM_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN:?Set in private speech.env}
    ports:
      - '18002:8000' # Private EC2 only; Security Group allows inbound only from EC2 Core
    volumes:
      - viegem-models:/app/models/viegem-fsmn:ro
    depends_on:
      viegem-models:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
volumes:
  viegem-models:

name: TINA - Build and Push GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - demo/aws
    paths:
      - ".github/workflows/ghcr-publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/demo/aws'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: terminal
            context: .
            dockerfile: clients/terminal/Dockerfile

          - name: gateway
            context: .
            dockerfile: core/gateway/services/gateway/Dockerfile

          - name: meeting-api
            context: .
            dockerfile: core/meetings/services/meeting-api/Dockerfile

          - name: agent-api
            context: .
            dockerfile: core/agent/services/agent-api/Dockerfile

          - name: admin-api
            context: core/identity/services/admin-api
            dockerfile: core/identity/services/admin-api/Dockerfile

          - name: runtime
            context: core/runtime
            dockerfile: core/runtime/Dockerfile

          - name: agent-worker
            context: .
            dockerfile: core/agent/worker/Dockerfile

          - name: mcp
            context: core/meetings/services/mcp
            dockerfile: core/meetings/services/mcp/Dockerfile

          - name: flows
            context: .
            dockerfile: core/flows/Dockerfile

          - name: dashboard
            context: .
            dockerfile: services/dashboard/Dockerfile
            build_args: TINA_API_URL=http://gateway:8000

          - name: agent-reach
            context: deploy/agent-reach
            dockerfile: deploy/agent-reach/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Docker build source
        env:
          BUILD_SOURCE: ${{ runner.temp }}/tina-build
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_SOURCE"
          git archive --format=tar HEAD |
            tar --extract --directory="$BUILD_SOURCE" --exclude='.env' --exclude='.env.*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/tina-build/${{ matrix.context }}
          file: ${{ runner.temp }}/tina-build/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/poor-frog/tina-${{ matrix.name }}:demo
            ghcr.io/poor-frog/tina-${{ matrix.name }}:${{ github.sha }}

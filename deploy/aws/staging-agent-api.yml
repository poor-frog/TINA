AWSTemplateFormatVersion: '2010-09-09'
Description: Private TINA Agent API with durable staging workspaces and dynamic worker roles.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  WorkspaceBedrockOwner: {Type: String, Default: '', AllowedPattern: '(|[1-9][0-9]*(,[1-9][0-9]*)*)'}
  ClusterName: {Type: String}
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  AppSubnetIds: {Type: 'List<AWS::EC2::Subnet::Id>'}
  AppSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  CoreIngressSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  CoreClientSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  RuntimeClientSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  ServiceNamespaceId: {Type: String}
  AgentApiImage: {Type: String, AllowedPattern: '[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}'}
  RuntimeUrl: {Type: String}
  ValkeyHost: {Type: String}
  ValkeySecretArn: {Type: String}
  ValkeySecurityGroupId: {Type: String, Default: ''}
  InvocationBucket: {Type: String, Default: ''}
  CoreInternalSecretArn: {Type: String}
  AgentReachUrl: {Type: String, Default: ''}
  AgentReachClientSecurityGroupId: {Type: String, Default: ''}
  ChatGPTVoiceOwner: {Type: String, Default: '', AllowedPattern: '[0-9]*'}
  ChatGPTVoiceRoom: {Type: String, Default: '', AllowedPattern: '(|[a-z]{3}-[a-z]{4}-[a-z]{3})'}
  ChatGPTVoiceSecretArn: {Type: String, Default: ''}
  ChatGPTVoiceModel: {Type: String, Default: gpt-6-luna}
  EnableVoiceCompletion:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  EnableDurableWorkspace:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  EnableLegacyEfs:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  WorkspacePilotUserIds: {Type: String, Default: '', AllowedPattern: '(|[*]|[0-9]+(,[0-9]+)*)'}
  WorkspaceBedrockModel: {Type: String, Default: 'us.anthropic.claude-sonnet-4-6'}
  WorkspaceStorage: {Type: String, Default: efs, AllowedValues: [efs, s3]}
  WorkspaceS3Bucket: {Type: String, Default: ''}
  WorkspaceS3DataKeyArn: {Type: String, Default: ''}
  WorkspaceS3SecretsKeyArn: {Type: String, Default: ''}
  WorkspaceS3Users: {Type: String, Default: '*', AllowedPattern: '(|[*]|[0-9]+(,[0-9]+)*)'}
  MigrateFromEfs: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  WorkspaceChatGPTOwner: {Type: String, Default: '', AllowedPattern: '[0-9]*'}
  WorkspaceChatGPTSecretArn: {Type: String, Default: ''}
  WorkspaceRuntimeSecurityGroupId: {Type: String, Default: ''}
  WorkspaceWikiRoleA: {Type: String, Default: '', AllowedPattern: '(|arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)'}
  WorkspaceWikiRoleB: {Type: String, Default: '', AllowedPattern: '(|arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)'}
  WorkspaceSharedRoleC: {Type: String, Default: '', AllowedPattern: '(|arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)'}
  WorkspacePilotRoleA:
    Type: String
    Default: ''
    AllowedPattern: '(|arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)'
  WorkspacePilotRoleB:
    Type: String
    Default: ''
    AllowedPattern: '(|arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)'
  DraftPilotUserIds:
    Type: String
    Default: ''
    AllowedPattern: '(|[*]|[0-9]+(,[0-9]+)*)'

Conditions:
  WithAgentReach: !And
    - !Not [!Equals [!Ref AgentReachUrl, '']]
    - !Not [!Equals [!Ref AgentReachClientSecurityGroupId, '']]
  WithVoiceCompletion: !Equals [!Ref EnableVoiceCompletion, 'true']
  WithWorkspaceChatGPT: !And
    - !Condition WithWorkspacePilot
    - !Not [!Equals [!Ref WorkspaceChatGPTOwner, '']]
    - !Not [!Equals [!Ref WorkspaceChatGPTSecretArn, '']]
  WithWorkspacePilot: !Not [!Equals [!Ref WorkspacePilotUserIds, '']]
  WithWikiRoles: !And
    - !Condition WithWorkspacePilotRoles
    - !Not [!Equals [!Ref WorkspaceWikiRoleA, '']]
    - !Not [!Equals [!Ref WorkspaceWikiRoleB, '']]
  WithWorkspaceSharedRoleC: !And
    - !Condition WithWorkspacePilotRoles
    - !Not [!Equals [!Ref WorkspaceSharedRoleC, '']]
  WithWorkspacePilotRoles: !And
    - !Not [!Equals [!Ref WorkspacePilotRoleA, '']]
    - !Not [!Equals [!Ref WorkspacePilotRoleB, '']]
  WithWorkspace: !Equals [!Ref EnableDurableWorkspace, 'true']
  WithLegacyEfs: !And
    - !Condition WithWorkspace
    - !Equals [!Ref EnableLegacyEfs, 'true']
  WithDynamicWorkspace: !And
    - !Condition WithLegacyEfs
    - !Condition WithWorkspacePilot
    - !Not [!Equals [!Ref ValkeySecurityGroupId, '']]
    - !Not [!Equals [!Ref InvocationBucket, '']]
  WithS3Workspace: !And
    - !Equals [!Ref WorkspaceStorage, 's3']
    - !Not [!Equals [!Ref WorkspaceS3Bucket, '']]
  WithEfsMigration: !And
    - !Condition WithS3Workspace
    - !Condition WithLegacyEfs
    - !Equals [!Ref MigrateFromEfs, 'true']
  WithTaskRole: !Or [!Condition WithVoiceCompletion, !Condition WithWorkspace]
  WithChatGPTVoice:
    !And
      - !Condition WithVoiceCompletion
      - !Not [!Equals [!Ref ChatGPTVoiceOwner, '']]
      - !Not [!Equals [!Ref ChatGPTVoiceRoom, '']]
      - !Not [!Equals [!Ref ChatGPTVoiceSecretArn, '']]

Resources:
  DispatchSigningKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 7}
  Ingress:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private TINA Agent API access from staging Core
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8100, ToPort: 8100, SourceSecurityGroupId: !Ref CoreIngressSecurityGroupId}
  WorkspaceSchedulerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithWorkspacePilot
    Properties:
      GroupId: !GetAtt Ingress.GroupId
      SourceSecurityGroupId: !Ref WorkspaceRuntimeSecurityGroupId
      IpProtocol: tcp
      FromPort: 8100
      ToPort: 8100
  Discovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: agent-api
      DnsConfig:
        NamespaceId: !Ref ServiceNamespaceId
        DnsRecords: [{Type: A, TTL: 15}]
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: PullImageAndReadAgentSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/agent-api'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt Logs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DispatchSigningKey, !Ref ValkeySecretArn, !Ref CoreInternalSecretArn]
  VoiceModelRole:
    Type: AWS::IAM::Role
    Condition: WithTaskRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - !If
          - WithVoiceCompletion
          - PolicyName: InvokeVoiceBedrockModels
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0'
                    - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*'
                    - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-*'
          - !Ref 'AWS::NoValue'
        - !If
          - WithWorkspaceChatGPT
          - PolicyName: RefreshWorkspaceChatGPTConnection
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue, secretsmanager:UpdateSecretVersionStage]
                  Resource: !Ref WorkspaceChatGPTSecretArn
          - !Ref AWS::NoValue
        - !If
          - WithChatGPTVoice
          - PolicyName: RefreshStagingChatGPTConnection
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue]
                  Resource: !Ref ChatGPTVoiceSecretArn
          - !Ref 'AWS::NoValue'
  DynamicWorkspaceLogs:
    Type: AWS::Logs::LogGroup
    Condition: WithDynamicWorkspace
    Properties: {RetentionInDays: 7}
  DynamicWorkspaceExecutionRole:
    Type: AWS::IAM::Role
    Condition: WithDynamicWorkspace
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal: {Service: ecs-tasks.amazonaws.com}
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: PullDynamicWorkerAndInvocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/agent-worker'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DynamicWorkspaceLogs.Arn
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref ValkeySecretArn}
              - {Effect: Allow, Action: 's3:GetBucketLocation', Resource: !Sub 'arn:${AWS::Partition}:s3:::${InvocationBucket}'}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/workspace/*'
  DynamicWorkspaceTaskRole:
    Type: AWS::IAM::Role
    Condition: WithDynamicWorkspace
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal: {Service: ecs-tasks.amazonaws.com}
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: DynamicWorkspaceBedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-*'
  DynamicWorkspaceEfsPolicy:
    Type: AWS::IAM::Policy
    Condition: WithDynamicWorkspace
    Properties:
      PolicyName: DynamicWorkspaceEfs
      Roles: [!Ref DynamicWorkspaceTaskRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
            Resource: !GetAtt WorkspaceFileSystem.Arn
  WorkspaceFileSystem:
    Type: AWS::EFS::FileSystem
    Condition: WithLegacyEfs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Restrict workspace EFS mounts to the Agent API, pinned worker roles, and dynamic access-point-scoped worker role.
        must:
          - Keep TLS and IAM authorization enabled for every EFS client.
          - Mount worker volumes exclusively via validated per-path EFS access points.
    Properties:
      Encrypted: true
      FileSystemTags: [{Key: Name, Value: tina-staging-workspaces}]
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'elasticfilesystem:Client*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Effect: Deny
            Principal: '*'
            Action: 'elasticfilesystem:Client*'
            Condition:
              ArnNotEquals:
                'aws:PrincipalArn': !If
                  - WithWorkspacePilotRoles
                  - !If
                    - WithWikiRoles
                    - !If
                      - WithWorkspaceSharedRoleC
                      - - !GetAtt VoiceModelRole.Arn
                        - !Ref WorkspacePilotRoleA
                        - !Ref WorkspacePilotRoleB
                        - !Ref WorkspaceWikiRoleA
                        - !Ref WorkspaceWikiRoleB
                        - !Ref WorkspaceSharedRoleC
                        - !If [WithDynamicWorkspace, !GetAtt DynamicWorkspaceTaskRole.Arn, !Ref 'AWS::NoValue']
                      - - !GetAtt VoiceModelRole.Arn
                        - !Ref WorkspacePilotRoleA
                        - !Ref WorkspacePilotRoleB
                        - !Ref WorkspaceWikiRoleA
                        - !Ref WorkspaceWikiRoleB
                        - !If [WithDynamicWorkspace, !GetAtt DynamicWorkspaceTaskRole.Arn, !Ref 'AWS::NoValue']
                    - !If
                      - WithWorkspaceSharedRoleC
                      - - !GetAtt VoiceModelRole.Arn
                        - !Ref WorkspacePilotRoleA
                        - !Ref WorkspacePilotRoleB
                        - !Ref WorkspaceSharedRoleC
                        - !If [WithDynamicWorkspace, !GetAtt DynamicWorkspaceTaskRole.Arn, !Ref 'AWS::NoValue']
                      - - !GetAtt VoiceModelRole.Arn
                        - !Ref WorkspacePilotRoleA
                        - !Ref WorkspacePilotRoleB
                        - !If [WithDynamicWorkspace, !GetAtt DynamicWorkspaceTaskRole.Arn, !Ref 'AWS::NoValue']
                  - - !GetAtt VoiceModelRole.Arn
                    - !If [WithDynamicWorkspace, !GetAtt DynamicWorkspaceTaskRole.Arn, !Ref 'AWS::NoValue']
  WorkspaceAccessPoint:
    Type: AWS::EFS::AccessPoint
    Condition: WithLegacyEfs
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      PosixUser: {Uid: '1000', Gid: '1000'}
      RootDirectory:
        Path: /workspaces
        CreationInfo: {OwnerUid: '1000', OwnerGid: '1000', Permissions: '0700'}
  WorkspaceNfs:
    Type: AWS::EC2::SecurityGroup
    Condition: WithLegacyEfs
    Properties:
      GroupDescription: Workspace NFS from the TINA staging Agent API
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !GetAtt Ingress.GroupId}
  DynamicWorkspaceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WithDynamicWorkspace
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Private dynamic staging workspace worker egress
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 6379, ToPort: 6379, DestinationSecurityGroupId: !Ref ValkeySecurityGroupId}
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, DestinationSecurityGroupId: !GetAtt WorkspaceNfs.GroupId}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  DynamicWorkspaceNfsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithDynamicWorkspace
    Properties:
      GroupId: !GetAtt WorkspaceNfs.GroupId
      SourceSecurityGroupId: !GetAtt DynamicWorkspaceSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
  DynamicWorkspaceValkeyIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithDynamicWorkspace
    Properties:
      GroupId: !Ref ValkeySecurityGroupId
      SourceSecurityGroupId: !GetAtt DynamicWorkspaceSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
  WorkspaceMountTargetA:
    Type: AWS::EFS::MountTarget
    Condition: WithLegacyEfs
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      SubnetId: !Select [0, !Ref AppSubnetIds]
      SecurityGroups: [!GetAtt WorkspaceNfs.GroupId]
  WorkspaceMountTargetB:
    Type: AWS::EFS::MountTarget
    Condition: WithLegacyEfs
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      SubnetId: !Select [1, !Ref AppSubnetIds]
      SecurityGroups: [!GetAtt WorkspaceNfs.GroupId]
  WorkspacePermissions:
    Type: AWS::IAM::Policy
    Condition: WithLegacyEfs
    Properties:
      PolicyName: WorkspaceViaAccessPoint
      Roles: [!Ref VoiceModelRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
            Resource: !GetAtt WorkspaceFileSystem.Arn
            Condition: {StringEquals: {'elasticfilesystem:AccessPointArn': !GetAtt WorkspaceAccessPoint.Arn}}
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '512'
      Memory: '2048'
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: ARM64}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !If [WithTaskRole, !GetAtt VoiceModelRole.Arn, !Ref 'AWS::NoValue']
      Volumes:
        - !If
          - WithLegacyEfs
          - Name: workspaces
            EFSVolumeConfiguration:
              FilesystemId: !Ref WorkspaceFileSystem
              TransitEncryption: ENABLED
              AuthorizationConfig: {AccessPointId: !Ref WorkspaceAccessPoint, IAM: ENABLED}
          - !Ref 'AWS::NoValue'
        - !If
          - WithS3Workspace
          - Name: s3-cache
          - !Ref 'AWS::NoValue'
      ContainerDefinitions:
        - !If
          - WithS3Workspace
          - Name: init-s3-cache
            Image: !Ref AgentApiImage
            Essential: false
            EntryPoint: [sh, -c]
            Command: ["chown 1000:1000 /workspaces && chmod 0755 /workspaces"]
            MountPoints:
              - {SourceVolume: s3-cache, ContainerPath: /workspaces, ReadOnly: false}
            LogConfiguration:
              LogDriver: awslogs
              Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: init}
          - !Ref 'AWS::NoValue'
        - Name: agent-api
          Image: !Ref AgentApiImage
          Essential: true
          User: !If [WithWorkspace, '1000:1000', !Ref 'AWS::NoValue']
          DependsOn: !If
            - WithS3Workspace
            - [{ContainerName: init-s3-cache, Condition: SUCCESS}]
            - !Ref 'AWS::NoValue'
          PortMappings: [{ContainerPort: 8100}]
          LinuxParameters: {InitProcessEnabled: true}
          MountPoints:
            - !If
              - WithS3Workspace
              - {SourceVolume: s3-cache, ContainerPath: /workspaces, ReadOnly: false}
              - !If [WithLegacyEfs, {SourceVolume: workspaces, ContainerPath: /workspaces, ReadOnly: false}, !Ref 'AWS::NoValue']
            - !If [WithEfsMigration, {SourceVolume: workspaces, ContainerPath: /mnt/efs-workspaces, ReadOnly: true}, !Ref 'AWS::NoValue']
          Environment:
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: VALKEY_HOST, Value: !Ref ValkeyHost}
            - {Name: TINA_WORKSPACE_STORAGE, Value: !Ref WorkspaceStorage}
            - !If [WithS3Workspace, {Name: TINA_S3_WORKSPACE_BUCKET, Value: !Ref WorkspaceS3Bucket}, !Ref 'AWS::NoValue']
            - !If [WithS3Workspace, {Name: TINA_S3_WORKSPACE_KMS_KEY_ID, Value: !Ref WorkspaceS3DataKeyArn}, !Ref 'AWS::NoValue']
            - !If [WithS3Workspace, {Name: TINA_S3_SECRETS_KMS_KEY_ID, Value: !Ref WorkspaceS3SecretsKeyArn}, !Ref 'AWS::NoValue']
            - !If [WithS3Workspace, {Name: TINA_S3_WORKSPACE_USERS, Value: !Ref WorkspaceS3Users}, !Ref 'AWS::NoValue']
            - !If [WithEfsMigration, {Name: TINA_S3_MIGRATE_FROM_EFS_DIR, Value: /mnt/efs-workspaces}, !Ref 'AWS::NoValue']
            - {Name: TINA_RUNTIME_API_URL, Value: !Ref RuntimeUrl}
            - {Name: TINA_MEETING_API_URL, Value: 'http://core.tina-staging.local:8080'}
            - {Name: TINA_ADMIN_API_URL, Value: 'http://core.tina-staging.local:8001'}
            - {Name: TINA_GATEWAY_URL, Value: 'http://core.tina-staging.local:8000'}
            - {Name: TINA_REQUIRE_GATEWAY_IDENTITY, Value: '1'}
            - {Name: TINA_ROUTINE_RECONCILE_INTERVAL_SEC, Value: !If [WithWorkspacePilot, '60', '0']}
            - !If [WithWorkspacePilot, {Name: TINA_AGENT_API_SELF_URL, Value: 'http://agent-api.tina-staging.local:8100'}, !Ref AWS::NoValue]
            - {Name: TINA_WORKSPACE_PILOT_USER_IDS, Value: !Ref WorkspacePilotUserIds}
            - {Name: TINA_WORKSPACE_BEDROCK_OWNER, Value: !Ref WorkspaceBedrockOwner}
            - !If [WithWorkspacePilot, {Name: TINA_WORKSPACE_BEDROCK_MODEL, Value: !Ref WorkspaceBedrockModel}, !Ref 'AWS::NoValue']
            - !If [WithWorkspaceChatGPT, {Name: TINA_CHATGPT_WORKSPACE_OWNER, Value: !Ref WorkspaceChatGPTOwner}, !Ref AWS::NoValue]
            - !If [WithWorkspaceChatGPT, {Name: TINA_CHATGPT_WORKSPACE_SECRET_ARN, Value: !Ref WorkspaceChatGPTSecretArn}, !Ref AWS::NoValue]
            - !If [WithWorkspace, {Name: TINA_POST_MEETING_ECS_DRAFT, Value: '1'}, !Ref 'AWS::NoValue']
            - !If [WithWorkspace, {Name: TINA_DRAFT_PILOT_USER_IDS, Value: !Ref DraftPilotUserIds}, !Ref 'AWS::NoValue']
            - !If [WithAgentReach, {Name: TINA_AGENT_REACH_URL, Value: !Ref AgentReachUrl}, !Ref 'AWS::NoValue']
            - !If [WithAgentReach, {Name: TINA_CHAT_TOOLBELT, Value: '["reach.web.search","reach.web.read","reach.github.search","reach.github.read"]'}, !Ref 'AWS::NoValue']
            - !If [WithVoiceCompletion, {Name: TINA_MEETING_VOICE_LOCAL_COMPLETION, Value: '1'}, !Ref 'AWS::NoValue']
            - !If [WithVoiceCompletion, {Name: TINA_LOCAL_COMPLETION_POOL, Value: '1'}, !Ref 'AWS::NoValue']
            - !If [WithVoiceCompletion, {Name: TINA_STATE_FAST_MODEL, Value: 'amazon.nova-lite-v1:0'}, !Ref 'AWS::NoValue']
            - !If [WithVoiceCompletion, {Name: TINA_STATE_REASON_MODEL, Value: 'amazon.nova-lite-v1:0'}, !Ref 'AWS::NoValue']
            - !If [WithVoiceCompletion, {Name: TINA_LLM_PROVIDER, Value: bedrock-converse}, !Ref 'AWS::NoValue']
            - !If [WithVoiceCompletion, {Name: TINA_LLM_MODEL, Value: 'amazon.nova-lite-v1:0'}, !Ref 'AWS::NoValue']
            - !If [WithChatGPTVoice, {Name: TINA_CHATGPT_VOICE_SECRET_ARN, Value: !Ref ChatGPTVoiceSecretArn}, !Ref 'AWS::NoValue']
            - !If [WithChatGPTVoice, {Name: TINA_CHATGPT_VOICE_OWNER, Value: !Ref ChatGPTVoiceOwner}, !Ref 'AWS::NoValue']
            - !If [WithChatGPTVoice, {Name: TINA_CHATGPT_VOICE_ROOM, Value: !Ref ChatGPTVoiceRoom}, !Ref 'AWS::NoValue']
            - !If [WithChatGPTVoice, {Name: TINA_CHATGPT_VOICE_MODEL, Value: !Ref ChatGPTVoiceModel}, !Ref 'AWS::NoValue']
          Secrets:
            - {Name: VALKEY_PASSWORD, ValueFrom: !Ref ValkeySecretArn}
            - {Name: TINA_INTERNAL_API_SECRET, ValueFrom: !Ref CoreInternalSecretArn}
            - {Name: TINA_DISPATCH_SIGNING_KEY, ValueFrom: !Ref DispatchSigningKey}
          Command:
            - python
            - -c
            - |
              import os
              import tempfile
              from urllib.parse import quote

              host = os.environ.pop("VALKEY_HOST")
              password = quote(os.environ.pop("VALKEY_PASSWORD"), safe="")
              os.environ["TINA_REDIS_URL"] = f"rediss://:{password}@{host}:6379/0"
              if os.environ.get("TINA_POST_MEETING_ECS_DRAFT") == "1":
                  os.environ["HOME"] = tempfile.mkdtemp(prefix="tina-agent-home-")
              os.execvp("uvicorn", ["uvicorn", "control_plane.api:app", "--host", "0.0.0.0", "--port", "8100"])
          HealthCheck:
            Command: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4).close()"]
            Interval: 15
            Timeout: 5
            Retries: 4
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}
  AgentApi:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref AppSubnetIds
          SecurityGroups:
            - !Ref AppSecurityGroupId
            - !Ref CoreClientSecurityGroupId
            - !Ref RuntimeClientSecurityGroupId
            - !GetAtt Ingress.GroupId
            - !If [WithAgentReach, !Ref AgentReachClientSecurityGroupId, !Ref 'AWS::NoValue']
      ServiceRegistries:
        - RegistryArn: !GetAtt Discovery.Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}

Outputs:
  ServiceName: {Value: !GetAtt AgentApi.Name}
  AgentApiUrl: {Value: 'http://agent-api.tina-staging.local:8100'}
  TaskDefinitionArn: {Value: !Ref TaskDefinition}
  LogGroupName: {Value: !Ref Logs}
  WorkspaceFileSystemId:
    Condition: WithLegacyEfs
    Value: !Ref WorkspaceFileSystem
  DynamicWorkspaceTaskRoleArn:
    Condition: WithDynamicWorkspace
    Value: !GetAtt DynamicWorkspaceTaskRole.Arn
  DynamicWorkspaceExecutionRoleArn:
    Condition: WithDynamicWorkspace
    Value: !GetAtt DynamicWorkspaceExecutionRole.Arn
  DynamicWorkspaceSecurityGroupId:
    Condition: WithDynamicWorkspace
    Value: !GetAtt DynamicWorkspaceSecurityGroup.GroupId
  DynamicWorkspaceLogGroup:
    Condition: WithDynamicWorkspace
    Value: !Ref DynamicWorkspaceLogs


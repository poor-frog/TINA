AWSTemplateFormatVersion: '2010-09-09'
Description: TINA ECS meeting-bot task definition, execution role, and log group.

Parameters:
  BotImage:
    Type: String
    AllowedPattern: '[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}'
  BotRepositoryArn:
    Type: String
  InvocationBucket:
    Type: String
  ClusterName:
    Type: String
    Default: tina-foundation-ecs
  ProbeInvocation:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

Conditions:
  Probe: !Equals [!Ref ProbeInvocation, 'true']

Resources:
  BotLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  BotExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LoadBotAndInvocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer]
                Resource: !Ref BotRepositoryArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BotLogs.Arn
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${InvocationBucket}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/*'
  BotTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '4096'
      Memory: '8192'
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: ARM64}
      ExecutionRoleArn: !GetAtt BotExecutionRole.Arn
      ContainerDefinitions:
        - Name: bot
          Image: !Ref BotImage
          Essential: true
          StopTimeout: 30
          EntryPoint: !If [Probe, [/bin/sh, -ec], !Ref 'AWS::NoValue']
          Command: !If
            - Probe
            - - |
                test "$TINA_BOT_CONFIG" = '{"smoke":"ready"}'
                echo TINA_ECS_INVOCATION_OK
                trap 'exit 0' TERM
                while sleep 1; do :; done
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Ref BotLogs
              awslogs-stream-prefix: ecs
  RuntimeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
      Policies:
        - PolicyName: ManagePinnedBotTasks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: '*'
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref BotTaskDefinition
                Condition:
                  ArnEquals: {'ecs:cluster': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'}
              - Effect: Allow
                Action: ecs:ListTasks
                Resource: '*'
                Condition:
                  ArnEquals: {'ecs:cluster': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'}
              - Effect: Allow
                Action: [ecs:DescribeTasks, ecs:ListTagsForResource]
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*'
              - Effect: Allow
                Action: ecs:StopTask
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*'
                Condition:
                  'Null': {'aws:ResourceTag/tina:runtime-workload': 'false'}
              - Effect: Allow
                Action: ecs:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*'
                Condition:
                  StringEquals: {'ecs:CreateAction': RunTask}
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BotExecutionRole.Arn
                Condition:
                  StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/*'

Outputs:
  BotTaskDefinitionArn:
    Value: !Ref BotTaskDefinition
  BotExecutionRoleArn:
    Value: !GetAtt BotExecutionRole.Arn
  BotLogGroup:
    Value: !Ref BotLogs
  RuntimeTaskRoleArn:
    Value: !GetAtt RuntimeTaskRole.Arn

name: TINA - GHCR Bot and ASR

on:
  workflow_dispatch:
  push:
    branches: [demo/aws]
    paths:
      - '.github/workflows/ghcr-publish-extras.yml'

permissions:
  contents: read
  packages: write

jobs:
  bot:
    if: github.ref == 'refs/heads/demo/aws'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space for Playwright bot
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h .
      - name: Prepare source without env secrets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tina-source"
          git archive --format=tar HEAD | tar --extract --directory="$RUNNER_TEMP/tina-source" \
            --exclude='.env' --exclude='.env.*' --exclude='.env.keys'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base and Meeting Bot (same local Docker daemon)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tina-source"
          docker build -f core/meetings/modules/join/Dockerfile.env \
            -t tina/meet-join-env:dev core/meetings/modules/join
          docker build -f core/meetings/services/bot/Dockerfile \
            --build-arg TINA_IMAGE_VERSION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t ghcr.io/poor-frog/tina-bot:"$GITHUB_SHA" .
          docker tag ghcr.io/poor-frog/tina-bot:"$GITHUB_SHA" ghcr.io/poor-frog/tina-bot:demo
          docker push ghcr.io/poor-frog/tina-bot:"$GITHUB_SHA"
          docker push ghcr.io/poor-frog/tina-bot:demo

  asr:
    if: github.ref == 'refs/heads/demo/aws'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gipformer
            dockerfile: deploy/transcription/gipformer/Dockerfile
          - name: viegem
            dockerfile: deploy/transcription/viegem/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare source without env secrets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tina-source"
          git archive --format=tar HEAD | tar --extract --directory="$RUNNER_TEMP/tina-source" \
            --exclude='.env' --exclude='.env.*' --exclude='.env.keys'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/tina-source
          file: ${{ runner.temp }}/tina-source/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/poor-frog/tina-${{ matrix.name }}:demo
            ghcr.io/poor-frog/tina-${{ matrix.name }}:${{ github.sha }}

version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        [[ "$TINA_REVISION" =~ ^[a-f0-9]{40}$ ]]
        [[ "$TINA_BUILD_TAG" == workspace-"$TINA_REVISION"-* ]]
        [[ "$ECR_REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com$ ]]
        test "$(uname -m)" = aarch64
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - |
        set -euo pipefail
        build_args=()
        build_context=.
        case "$TINA_COMPONENT" in
          terminal)
            repo=tina-staging/terminal
            dockerfile=clients/terminal/Dockerfile
            build_args+=(--build-arg NEXT_PUBLIC_TERMINAL_MODE=workspace-pilot)
            executable=node
            check="require('node:assert').ok(require('node:fs').existsSync('.next/BUILD_ID'))"
            ;;
          agent-api)
            repo=tina-staging/agent-api
            dockerfile=core/agent/services/agent-api/Dockerfile
            executable=python
            check='import boto3, control_plane.api, control_plane.workspace_store, control_plane.workspace_reader, worker.local_completion, worker.meeting_voice_local'
            ;;
          runtime)
            repo=tina-foundation/runtime
            dockerfile=core/runtime/Dockerfile
            build_context=core/runtime
            executable=python
            check='import boto3, runtime_kernel.ecs_backend, runtime_kernel.s3_workspace, runtime_kernel.egress_proxy'
            ;;
          worker)
            repo=tina-staging/agent-worker
            dockerfile=core/agent/worker/Dockerfile
            executable=python
            check='import boto3, worker.workspace_sync, worker.workspace_stream; from llm.registry import HARNESS_RUNNERS; assert "bedrock-workspace" in HARNESS_RUNNERS'
            ;;
          *)
            printf 'Unknown Workspace release component\n' >&2
            exit 2
            ;;
        esac
        image="$ECR_REGISTRY/$repo:$TINA_BUILD_TAG"
        docker build --platform linux/arm64 --label "org.opencontainers.image.revision=$TINA_REVISION" \
          -f "$dockerfile" "${build_args[@]}" -t "$image" "$build_context"
        test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
        if [[ "$executable" == python ]]; then
          docker run --rm --network none --entrypoint python "$image" -B -c "$check"
        else
          docker run --rm --network none --entrypoint node "$image" -e "$check"
        fi
        docker push "$image"

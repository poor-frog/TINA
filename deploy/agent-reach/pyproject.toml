[project]
name = "tina-agent-reach"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "agent-reach @ https://github.com/Panniantong/Agent-Reach/archive/c70ae6da5d39bc90e09ad2ae0575ccc89f31e284.tar.gz",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.25,<2"]

[tool.uv]
package = false

[tool.setuptools]
py-modules = ["server", "runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

AWSTemplateFormatVersion: '2010-09-09'
Description: TINA Terminal behind the staging internal ALB and CloudFront.
Metadata:
  AWSToolsMetrics: {AWSAgentToolkit: 'true'}

Parameters:
  ClusterName: {Type: String}
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  AppSubnetIds: {Type: 'List<AWS::EC2::Subnet::Id>'}
  CoreClientSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  AlbSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  ListenerArn: {Type: String}
  StageUrl: {Type: String}
  TerminalImage:
    Type: String
    AllowedPattern: '[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}'
  TerminalRepositoryArn: {Type: String}
  AdminTokenArn: {Type: String}
  InternalSecretArn: {Type: String}
  AsrControlUrl: {Type: String, Default: ''}
  VieGemSecurityGroupId: {Type: String, Default: ''}
  TranscriptionUrl: {Type: String, Default: ''}
  TranscriptionTokenArn: {Type: String, Default: ''}
  TranscriptionModel: {Type: String, Default: '5CD-AI/VieGem-ASR'}
  GoogleSecretArn: {Type: String, Default: ''}
  AdminEmails: {Type: String, Default: ''}
  WorkspacePilotStage: {Type: String, Default: closed, AllowedValues: [closed, chat, wiki, routines]}
  WorkspacePilotUserIds: {Type: String, Default: '', AllowedPattern: '(|[*]|[0-9]+(,[0-9]+)*)'}
  HideModelSettings: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  GatewayExtensionOrigins: {Type: String, Default: ''}
  ExtensionStoreUrl: {Type: String, Default: ''}

Conditions:
  GoogleEnabled: !Not [!Equals [!Ref GoogleSecretArn, '']]
  WithVieGemIngress: !Not [!Equals [!Ref VieGemSecurityGroupId, '']]
  WithTranscription: !And
    - !Not [!Equals [!Ref TranscriptionUrl, '']]
    - !Not [!Equals [!Ref TranscriptionTokenArn, '']]
  WithAdminEmails: !Not [!Equals [!Ref AdminEmails, '']]
  WithWorkspacePilot: !Not [!Equals [!Ref WorkspacePilotUserIds, '']]
  WithHideModelSettings: !Equals [!Ref HideModelSettings, 'true']
  WithExtensionOrigins: !Not [!Equals [!Ref GatewayExtensionOrigins, '']]
  WithExtensionStoreUrl: !Not [!Equals [!Ref ExtensionStoreUrl, '']]

Resources:
  NextAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  TerminalLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 7}
  TerminalIngress:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Terminal HTTP from the internal staging ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSecurityGroupId}
  TerminalVieGemIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithVieGemIngress
    Properties:
      GroupId: !Ref VieGemSecurityGroupId
      SourceSecurityGroupId: !GetAtt TerminalIngress.GroupId
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
  TerminalTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/auth/providers
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
  TerminalRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: 100
      Conditions:
        - {Field: path-pattern, Values: ['/*']}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref TerminalTargets}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: PullTerminalAndInjectSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer]
                Resource: !Ref TerminalRepositoryArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TerminalLogs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AdminTokenArn
                  - !Ref InternalSecretArn
                  - !Ref NextAuthSecret
                  - !If [GoogleEnabled, !Ref GoogleSecretArn, !Ref 'AWS::NoValue']
                  - !If [WithTranscription, !Ref TranscriptionTokenArn, !Ref 'AWS::NoValue']
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Expose the full workbench only to server-verified pilot identities.
        must: Keep meetings as the default and match the image's build-time mode to the rollout parameter.
    Properties:
      Family: !Ref AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform: {OperatingSystemFamily: LINUX, CpuArchitecture: ARM64}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: terminal
          Image: !Ref TerminalImage
          Essential: true
          PortMappings: [{ContainerPort: 3000}]
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: HOSTNAME, Value: 0.0.0.0}
            - {Name: PORT, Value: '3000'}
            - {Name: NEXT_PUBLIC_TERMINAL_MODE, Value: !If [WithWorkspacePilot, workspace-pilot, meetings]}
            - {Name: NEXT_PUBLIC_HIDE_MODEL_SETTINGS, Value: !If [WithHideModelSettings, '1', '0']}
            - {Name: TINA_WORKSPACE_PILOT_STAGE, Value: !Ref WorkspacePilotStage}
            - {Name: TINA_WORKSPACE_PILOT_USER_IDS, Value: !Ref WorkspacePilotUserIds}
            - {Name: GATEWAY_URL, Value: 'http://core.tina-staging.local:8000'}
            - {Name: TINA_API_URL, Value: 'http://core.tina-staging.local:8000'}
            - {Name: TINA_ADMIN_API_URL, Value: 'http://core.tina-staging.local:8001'}
            - {Name: TINA_ASR_CONTROL_URL, Value: !Ref AsrControlUrl}
            - !If [WithTranscription, {Name: TRANSCRIPTION_SERVICE_URL, Value: !Ref TranscriptionUrl}, !Ref 'AWS::NoValue']
            - !If [WithTranscription, {Name: TRANSCRIPTION_MODEL, Value: !Ref TranscriptionModel}, !Ref 'AWS::NoValue']
            - !If [WithAdminEmails, {Name: TINA_ADMIN_EMAILS, Value: !Ref AdminEmails}, !Ref 'AWS::NoValue']
            - !If [WithExtensionOrigins, {Name: TINA_GATEWAY_EXTENSION_ORIGINS, Value: !Ref GatewayExtensionOrigins}, !Ref 'AWS::NoValue']
            - !If [WithExtensionStoreUrl, {Name: MEETTINA_EXTENSION_STORE_URL, Value: !Ref ExtensionStoreUrl}, !Ref 'AWS::NoValue']
            - {Name: NEXTAUTH_URL, Value: !Ref StageUrl}
            - {Name: TERMINAL_URL, Value: !Ref StageUrl}
          Secrets:
            - {Name: TINA_ADMIN_API_KEY, ValueFrom: !Ref AdminTokenArn}
            - {Name: TINA_INTERNAL_API_SECRET, ValueFrom: !Ref InternalSecretArn}
            - {Name: NEXTAUTH_SECRET, ValueFrom: !Ref NextAuthSecret}
            - !If
              - WithTranscription
              - {Name: TRANSCRIPTION_SERVICE_TOKEN, ValueFrom: !Ref TranscriptionTokenArn}
              - !Ref 'AWS::NoValue'
            - !If
              - GoogleEnabled
              - {Name: GOOGLE_CLIENT_ID, ValueFrom: !Sub '${GoogleSecretArn}:client_id::'}
              - !Ref AWS::NoValue
            - !If
              - GoogleEnabled
              - {Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub '${GoogleSecretArn}:client_secret::'}
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref TerminalLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: ecs}
  TerminalService:
    Type: AWS::ECS::Service
    DependsOn: TerminalRule
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref AppSubnetIds
          SecurityGroups:
            - !Ref CoreClientSecurityGroupId
            - !GetAtt TerminalIngress.GroupId
      LoadBalancers:
        - {ContainerName: terminal, ContainerPort: 3000, TargetGroupArn: !Ref TerminalTargets}
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}

Outputs:
  StageUrl:
    Value: !Ref StageUrl
  TerminalServiceName:
    Value: !GetAtt TerminalService.Name
  TargetGroupArn:
    Value: !Ref TerminalTargets

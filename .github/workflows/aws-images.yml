name: TINA - AWS Terminal and Bot

on:
  push:
    branches: [demo/aws]
    paths:
      - .github/workflows/aws-images.yml
      - .github/workflows/ghcr-publish-extras.yml
      - clients/terminal/**
      - core/meetings/services/bot/**
      - core/meetings/modules/gmeet-capture/**
      - core/meetings/modules/gmeet-pipeline/**
  workflow_dispatch:

permissions: {}

jobs:
  terminal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Docker build source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tina-source"
          git archive --format=tar HEAD |
            tar --extract --directory="$RUNNER_TEMP/tina-source" --exclude='.env' --exclude='.env.*' --exclude='.env.keys'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/tina-source
          file: ${{ runner.temp }}/tina-source/clients/terminal/Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/poor-frog/tina-terminal:${{ github.sha }}

  bot:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-publish-extras.yml
    with:
      revision: ${{ github.sha }}
      build-asr: false
      build-livekit: false

  promote:
    needs: [terminal, bot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: tina-ghcr-prod
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish current AWS demo images
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/demo/aws" --jq '.object.sha')
          if [[ "$BUILD_SHA" != "$branch_sha" ]]; then
            echo "Skipping superseded AWS demo revision $BUILD_SHA"
            exit 0
          fi
          for service in terminal bot; do
            image="ghcr.io/poor-frog/tina-$service"
            docker buildx imagetools create --prefer-index=false --tag "$image:prod" "$image:$BUILD_SHA"
          done

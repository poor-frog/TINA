# Local Option A inference. Layer after docker-compose.yml with a private .env.local.
# Requires NVIDIA GPU access in Docker Desktop/WSL2 (8 GB VRAM is sufficient for this model).
services:
  runtime:
    environment:
      TINA_LLM_MAX_TOKENS: "1200"

  terminal:
    build:
      args:
        RUNTIME_DEPS: dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "1000"
    volumes:
      - ../../clients/terminal/src:/app/clients/terminal/src:ro

  ollama:
    image: ollama/ollama:0.20.5
    gpus: all
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "15m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tina]
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:0.20.5
    command: ["pull", "qwen2.5:7b-instruct"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [tina]

  agent-api:
    depends_on:
      ollama-model:
        condition: service_completed_successfully

volumes:
  ollama-models:

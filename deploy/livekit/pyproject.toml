[project]
name = "tina-livekit-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents==1.8.11",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "sherpa-onnx==2.0.1",
    "onnxruntime==1.31.1",
    "pipecat-ai==1.16.0",
    "langgraph==1.2.22",
    "langsmith==0.14.17",
    "jsonschema>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["../../core/agent/shared"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

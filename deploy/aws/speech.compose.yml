name: tina-speech
services:
  gipformer-models:
    image: ghcr.io/poor-frog/tina-gipformer:prod
    entrypoint:
      - python
      - /app/gipformer/install-models.py
      - --directory
      - /app/models/gipformer-fsmn
    volumes:
      - gipformer-models:/app/models/gipformer-fsmn
    restart: 'no'
  gipformer:
    image: ghcr.io/poor-frog/tina-gipformer:prod
    environment:
      TINA_GIPFORMER_HOST: '0.0.0.0'
      TINA_GIPFORMER_PORT: '8000'
      TINA_GIPFORMER_MODEL_DIR: /app/models/gipformer-fsmn
      TINA_GIPFORMER_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN:?Set in private speech.env}
    ports:
      - '18002:8000' # Private EC2 only; Security Group allows inbound only from EC2 Core
    volumes:
      - gipformer-models:/app/models/gipformer-fsmn:ro
    depends_on:
      gipformer-models:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
volumes:
  gipformer-models:

{{- if (.Values.mcp | default dict).enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tina.componentName" (list . "mcp") }}
  labels:
    {{- include "tina.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8010
      targetPort: http
  selector:
    {{- include "tina.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
